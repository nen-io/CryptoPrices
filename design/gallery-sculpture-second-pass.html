e-opacity=".43" stroke-width="2" stroke-linecap="round"/></g><path d="M80 426C206 483 469 486 562 422" fill="none" stroke="currentColor" opacity=".16"/><circle cx="80" cy="426" r="2.5" fill="currentColor" opacity=".4"/><circle cx="562" cy="422" r="2.5" fill="currentColor" opacity=".4"/></svg>`}

  function render(){const active=document.activeElement;const focusKey=active?.tagName==='BUTTON'?['action','range','filter'].find(k=>active.dataset[k]):null;const focusValue=focusKey?active.dataset[focusKey]:null;document.body.className=`variant-${state.variant.toLowerCase()}${state.reduced?' reduced':''}`;document.getElementById('app').innerHTML=(state.variant==='A'?renderA():state.variant==='B'?renderB():renderC())+switcher();document.title=`CryptoPrices · ${variantNames[state.variant]} study`;if(focusKey)document.querySelector(`button[data-${focusKey}="${CSS.escape(focusValue)}"]`)?.focus({preventScroll:true});}

  function openWallet(){previousFocus=document.activeElement;state.modal=true;document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="wallet-title"><div class="dialog-head"><span class="eyebrow muted">WATCH. DON'T CONNECT.</span><button class="icon-button" data-action="close-modal" aria-label="Close add address dialog">${icon('close')}</button></div><h2 id="wallet-title">A window into your wallet.</h2><p>Add a public address to the sample workspace. Your private keys and seed phrase are never needed.</p><form id="wallet-form"><label class="field">Wallet label<input id="wallet-label" name="label" maxlength="40" placeholder="e.g. Long-term savings" required autocomplete="off"></label><label class="field">Network<select name="chain" id="wallet-chain"><option>Ethereum</option><option>Solana</option><option>Bitcoin</option><option>Polygon</option><option>Arbitrum</option><option>Base</option><option>Avalanche</option><option>Optimism</option><option>BNB Smart Chain</option></select></label><label class="field">Public address<input name="address" id="wallet-address" placeholder="Paste a public address" autocomplete="off" spellcheck="false" required maxlength="130"></label><div class="dialog-notice">${icon('shield')}<strong>Provider: none connected in this study.</strong>Local storage and network sync are separate. In the real app, fetching balances sends this public address and your IP to the selected provider. Token coverage depends on the network and provider. This study saves only in memory and makes no requests.</div><div id="wallet-error" class="field-error" role="alert"></div><button class="primary" type="submit">${icon('plus')} Add to sample workspace</button><div class="dialog-footnote">Never enter a seed phrase, recovery phrase, or private key.<br>Nothing is stored after you reload this study.</div></form></section></div>`;document.getElementById('wallet-label').focus();document.getElementById('wallet-form').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target),name=String(data.get('label')).trim(),address=String(data.get('address')).trim(),chain=String(data.get('chain'));const evm=['Ethereum','Polygon','Arbitrum','Base','Avalanche','Optimism','BNB Smart Chain'].includes(chain),valid=evm?/^0x[0-9a-fA-F]{40}$/.test(address):chain==='Solana'?/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(address):/^(bc1[a-z0-9]{25,87}|[13][1-9A-HJ-NP-Za-km-z]{25,34})$/.test(address);if(!name||!valid){document.getElementById('wallet-error').textContent=`Enter a label and a public ${chain} address. This study checks its format only.`;return}state.wallets.push({name,address,chain,sample:false});closeModal();state.tab='wallets';render();announce('Address added in memory. No provider contacted; reload clears it.');});}
  function privacy(){previousFocus=document.activeElement;state.modal=true;document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="privacy-title"><div class="dialog-head"><span class="eyebrow muted">BUILT AROUND YOUR BOUNDARIES</span><button class="icon-button" data-action="close-modal" aria-label="Close privacy information">${icon('close')}</button></div><h2 id="privacy-title">A local place to look.</h2><p>The intended app uses an offline local profile and a local SQLite database. It tracks public addresses without holding signing keys.</p><div class="dialog-notice"><strong>Public doesn't mean private.</strong>A public wallet address can reveal transaction history and balances. A data provider can associate an address with your IP during sync. The app should make the provider explicit before the first request.</div><p>This disposable study uses sample data, makes no network requests, and stores nothing. Local database encryption, provider controls, and OS secure storage belong to the implementation and are not provided by this HTML file.</p><button class="primary" data-action="close-modal">Understood ${icon('arrow')}</button></section></div>`;document.querySelector('.dialog .icon-button').focus();}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.search='';state.filter='All assets';render();document.querySelector('main h1')?.setAttribute('tabindex','-1');document.querySelector('main h1')?.focus({preventScroll:true});return}if(b.dataset.range){state.range=b.dataset.range;render();return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}switch(b.dataset.action){case'prev-variant':setVariant(-1);break;case'next-variant':setVariant(1);break;case'add-wallet':openWallet();break;case'close-modal':closeModal();break;case'privacy':privacy();break;case'offline':state.offline=!state.offline;render();announce(state.offline?'Offline preview: sample balances remain visible.':'Online sample preview. No network requests are made.');break;case'motion':state.reduced=!state.reduced;render();announce(state.reduced?'Reduced motion enabled.':'Motion enabled. System reduced-motion preferences still apply.');break;case'refresh':announce(state.offline?'Offline preview. No refresh attempted.':'Sample values unchanged. No balances verified; no provider contacted.');break}});
  document.addEventListener('input',e=>{if(e.target.id==='asset-search'){state.search=e.target.value;const results=document.getElementById('table-results');if(results)results.outerHTML=table(state.tab==='markets');}});
  document.addEventListener('keydown',e=>{if(state.modal){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const nodes=[...document.querySelectorAll('.dialog button,.dialog input,.dialog select')],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setVariant(e.key==='ArrowRight'?1:-1)}});
  document.getElementById('overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});
  window.addEventListener('popstate',()=>{const key=new URLSearchParams(location.search).get('variant');if(variantNames[key]){state.variant=key;render()}});
  render();
</script>
